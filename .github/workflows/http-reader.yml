name: HTTP reader checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Check the locked HTTP reader
        run: |
          export HOME="$GITHUB_WORKSPACE/.scratch/home"
          export TMPDIR="$GITHUB_WORKSPACE/.scratch/tmp"
          export PYTHONDONTWRITEBYTECODE=1
          test "$HOME" = "$GITHUB_WORKSPACE/.scratch/home"
          test "$TMPDIR" = "$GITHUB_WORKSPACE/.scratch/tmp"
          mkdir -p "$HOME" "$TMPDIR"
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/python" -m pip install --disable-pip-version-check -r requirements-http-test.lock
          "$HOME/venv/bin/python" -B -m ov_http --help
          "$HOME/venv/bin/python" -B -m pytest -q -p no:cacheprovider --basetemp "$HOME/pytest" tests
